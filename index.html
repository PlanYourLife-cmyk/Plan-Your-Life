<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9f1fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan Your Life">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Plan Your Life</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--card:#fff;--tx:#14213d;--mut:#6b7488;--bd:#e1e6ef;--gold:#f5b301;--goldtx:#14213d;--teal:#346fb8;--on:#fff;--tealbg:#e1f4f2;--red:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}
header{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:800}
.purse{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--goldtx);padding:8px 16px 8px 8px;border-radius:999px;font-weight:800;font-size:20px}
.purse i{width:28px;height:28px;border-radius:50%;background:var(--goldtx);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:14px}
.purse.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;font-size:12px;padding:9px 4px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--tx);color:var(--bg);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
section{display:none}section.on{display:block}
.row{display:flex;align-items:center;gap:8px}
.bar{justify-content:space-between;margin-bottom:12px}
.bar h2{margin:0;font-size:12px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:12px;padding:8px 12px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--on);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
input.grow{flex:1;min-width:0}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 14px}
.prog b{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.task .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:none;cursor:pointer;flex:none;color:var(--on);font-size:14px;line-height:1}
.task.done .ck{background:var(--teal);border-color:var(--teal)}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .tx{text-decoration:line-through;color:var(--mut)}
.rw{font-weight:700;font-size:12px;color:var(--goldtx);background:var(--gold);border-radius:999px;padding:2px 9px;flex:none}
.task.done .rw{opacity:.45}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;padding:4px 6px}
.empty{color:var(--mut);text-align:center;padding:28px 8px;border:1px dashed var(--bd);border-radius:12px}
.add{margin-bottom:14px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;cursor:pointer;min-height:130px;min-width:0;text-align:left;font:inherit;color:inherit}
.day.today{border:2px solid var(--teal)}
.day h3{margin:0;font-size:12px}
.day small{color:var(--mut);display:block;margin-bottom:6px}
.day .mt{font-size:12px;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .mt.d{text-decoration:line-through;color:var(--mut)}
.day .cnt{font-weight:700;font-size:12px;color:var(--teal);margin-bottom:4px}
@media(max-width:640px){.week{grid-template-columns:1fr}.day{min-height:0}}
.pomo{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 16px}
.pomo .t{font-size:72px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pomo .m{color:var(--mut);margin-bottom:8px}
.pomo .row{justify-content:center;margin-top:16px;flex-wrap:wrap}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item b{overflow-wrap:anywhere}
.item .pr{font-weight:800}
.hist{color:var(--mut);font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
.gear{border:1px solid var(--bd);background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.pn{background:var(--card);color:var(--tx);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.pn h2{margin:0;font-size:17px}
.pn h3{font-size:13px;color:var(--mut);margin:18px 0 8px;font-weight:500}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw>button:not(.btn){width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw>button.on{border-color:var(--tx)}
.sw input{width:40px;height:32px;padding:0;border:0;background:none}
nav button{padding-left:2px;padding-right:2px}
.day{position:relative}
.stamp{position:absolute;right:6px;top:6px;width:48px;height:48px;border:2px solid var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:800;line-height:1.1;transform:rotate(-14deg);opacity:.85;pointer-events:none}
.pg{position:relative;height:20px;background:var(--bd);border-radius:999px;overflow:hidden;min-width:80px}
.pg b{position:absolute;left:0;top:0;bottom:0;background:var(--teal);opacity:.5}
.pg span{position:relative;display:block;text-align:center;font-size:10px;font-weight:700;line-height:20px;white-space:nowrap;padding:0 6px}
#goal{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:14px}
#goal .pg{flex:1}
.item .pg{width:100%}
.fl{font-weight:800;color:#ff7a00;font-size:13px;flex:none}
.flame{display:flex;flex-direction:column;align-items:center;min-width:42px;font-size:22px;line-height:1.1}
.flame b{font-size:13px;font-weight:800;color:#ff7a00}
.flame.off{filter:grayscale(1);opacity:.5}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.dots i.on{background:#ff7a00}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{flex:1;min-width:90px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 6px}
.bdg .ic{font-size:36px}
.bdg small{display:block;color:var(--mut)}
.bdg.lock{opacity:.4;filter:grayscale(1)}
.bdg .btn{margin-top:8px;font-size:12px;padding:6px 8px}
::placeholder{color:var(--mut);opacity:1}
.sub{display:block;color:var(--mut);font-size:12px}
.wd{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:12px;border-radius:8px;padding:6px 8px;cursor:pointer}
.wd.on{background:var(--teal);border-color:var(--teal);color:var(--on)}
#hdw{gap:4px;flex-wrap:wrap}
.dots i.na{background:none;border:1px dashed var(--bd)}
.ck:disabled{opacity:.3;cursor:default}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.sw>button.th{width:auto;height:auto;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Plan Your Life</h1><div class="row"><button class="gear" id="bgb" aria-label="Badges">🏅</button><button class="gear" id="gear" aria-label="Settings">⚙︎</button><div class="purse" id="purse"><i>$</i><span id="coins">0</span></div></div></header>
  <nav id="nav">
    <button data-t="today" class="on">Hôm nay</button>
    <button data-t="week">Tuần</button>
    <button data-t="habits">Thói quen</button>
    <button data-t="pomo">Pomodoro</button>
    <button data-t="shop">Cửa hàng</button>
  </nav>
  <div id="goal"></div>

  <section id="today" class="on">
    <div class="row bar">
      <button class="btn" id="pd">‹</button>
      <h2 id="dlabel"></h2>
      <div class="row"><button class="btn" id="td">Hôm nay</button><button class="btn" id="nd">›</button></div>
    </div>
    <div class="prog"><b id="pb"></b></div>
    <div class="row add">
      <input class="grow" id="nt" placeholder="Việc cần làm..." maxlength="120">
      <select id="nr"><option value="5">+5 xu</option><option value="10" selected>+10 xu</option><option value="20">+20 xu</option><option value="50">+50 xu</option></select>
      <button class="btn pri" id="addt">Thêm việc</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="week">
    <div class="row bar">
      <button class="btn" id="pw">‹</button><h2 id="wlabel"></h2><button class="btn" id="nw">›</button>
    </div>
    <div class="week" id="wgrid"></div>
  </section>

  <section id="pomo">
    <div class="pomo">
      <div class="m" id="pmode">Tập trung</div>
      <div class="t" id="ptime">25:00</div>
      <div class="row"><select id="ptask"></select></div>
      <div class="row">
        <button class="btn pri" id="pgo">Bắt đầu</button>
        <button class="btn" id="prs">Đặt lại</button>
        <button class="btn" id="psk">Bỏ qua</button>
      </div>
      <p class="m" style="margin-top:16px">Mỗi phiên tập trung 25 phút xong nhận +5 xu. Hôm nay: <b id="pcount">0</b> phiên.</p>
    </div>
  </section>

  <section id="shop">
    <div class="row add">
      <input class="grow" id="sn" placeholder="Phần thưởng muốn đổi (vd: trà sữa)" maxlength="60">
      <input id="sp" type="number" min="1" style="width:100px"><select id="sh"></select><input id="sd" type="number" min="1" style="width:90px">
      <button class="btn pri" id="adds">Thêm quà</button>
    </div>
    <div class="row bar"><button class="btn" id="sortb"></button></div>
    <div class="shop" id="items"></div>
    <h2 style="font-size:16px">Đã đổi</h2>
    <div id="hist"></div>
  </section>

  <section id="habits">
    <div class="row add"><input class="grow" id="hn" maxlength="60"><button class="btn pri" id="addh"></button></div>
    <div class="row add"><select id="hf"></select><div class="row" id="hdw"></div><input id="hdm" type="number" min="1" max="31" style="width:130px"><select id="hdur"></select><input id="hend" type="date"></div>
    <div id="hl"></div>
  </section>
</div>
<div class="ov" id="ov"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="settings"></h2><button class="x" id="cls" aria-label="Close">×</button></div>
  <h3 data-i="lang"></h3><div class="seg" id="sl"><button data-v="vi">Tiếng Việt</button><button data-v="en">English</button></div>
  <h3 data-i="theme"></h3><div class="sw" id="sw"></div>
</div></div>
<div class="ov" id="ovb"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="badgesT"></h2><button class="x" id="clsb" aria-label="Close">×</button></div>
  <div class="badges" id="bd" style="margin-top:14px"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='planner-xu-v1';
let S={coins:0,tasks:[],shop:[{id:1,name:'Trà sữa',price:50},{id:2,name:'1 tập phim',price:30},{id:3,name:'30 phút chơi game',price:40}],bought:[],pomos:{},set:{lang:'vi',theme:'blue'},habits:[],badges:{},worn:{},pin:0,sort:'asc'};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mon=d=>addDays(d,-((d.getDay()+6)%7));
const DOWS={vi:['CN','T2','T3','T4','T5','T6','T7'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
let sel=ymd(new Date()), wk=mon(new Date());
const todayStr=()=>ymd(new Date());
const uid=()=>Date.now()+Math.floor(Math.random()*1000);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800);}
function earn(n){S.coins+=n;const p=$('#purse');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');}
function tab(t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
$('#nav').onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t);};

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

function renderToday(){
  const d=parse(sel);
  $('#dlabel').textContent=(sel===todayStr()?tr('todayC'):DOWS[S.set.lang][d.getDay()]+', ')+pad(d.getDate())+'/'+pad(d.getMonth()+1);
  const ts=S.tasks.filter(t=>t.date===sel);
  const done=ts.filter(t=>t.done).length;
  $('#pb').style.width=(ts.length?done/ts.length*100:0)+'%';
  const L=$('#list');L.innerHTML='';
  const hs=sel===todayStr()?S.habits.filter(h=>dueOn(h,sel)):[];
  hs.forEach(h=>{const dn=!!h.log[sel],r=el('div','task'+(dn?' done':'')),c=el('button','ck',dn?'✓':'');c.onclick=()=>tickHabit(h.id);r.append(c,el('div','tx',h.name),el('span','fl','🔥 '+streakOf(h)));L.append(r);});
  if(!ts.length&&!hs.length){L.append(el('div','empty',tr('emptyT')));return;}
  ts.forEach(t=>{
    const r=el('div','task'+(t.done?' done':''));
    const c=el('button','ck',t.done?'✓':'');c.setAttribute('aria-label','Hoàn thành');c.onclick=()=>toggle(t.id);
    const x=el('button','x','×');x.setAttribute('aria-label','Xóa việc');x.onclick=()=>{if(t.done)earn(-t.reward);S.tasks=S.tasks.filter(k=>k.id!==t.id);save();render();};
    r.append(c,el('div','tx',t.text),el('span','rw','+'+t.reward),x);L.append(r);
  });
}
function toggle(id){
  const t=S.tasks.find(k=>k.id===id);if(!t)return;
  t.done=!t.done;
  if(t.done){earn(t.reward);toast(tr('earned',t.reward));}else earn(-t.reward);
  save();render();
}
function addTask(){
  const v=$('#nt').value.trim();if(!v)return;
  S.tasks.push({id:uid(),text:v,date:sel,reward:+$('#nr').value,done:false});
  $('#nt').value='';save();render();
}
$('#addt').onclick=addTask;
$('#nt').onkeydown=e=>{if(e.key==='Enter')addTask();};
$('#pd').onclick=()=>{sel=ymd(addDays(parse(sel),-1));render();};
$('#nd').onclick=()=>{sel=ymd(addDays(parse(sel),1));render();};
$('#td').onclick=()=>{sel=todayStr();render();};

function renderWeek(){
  const e=addDays(wk,6);
  $('#wlabel').textContent=pad(wk.getDate())+'/'+pad(wk.getMonth()+1)+' – '+pad(e.getDate())+'/'+pad(e.getMonth()+1);
  const G=$('#wgrid');G.innerHTML='';
  for(let i=0;i<7;i++){
    const d=addDays(wk,i),k=ymd(d),ts=S.tasks.filter(t=>t.date===k);
    const b=el('button','day'+(k===todayStr()?' today':''));
    b.append(el('h3','',DOWS[S.set.lang][d.getDay()]),el('small','',pad(d.getDate())+'/'+pad(d.getMonth()+1)));
    const hd=S.habits.filter(h=>dueOn(h,k));
    if((ts.length||hd.length)&&ts.every(t=>t.done)&&hd.every(h=>h.log[k]))b.append(el('div','stamp',tr('perfect')));
    if(ts.length)b.append(el('div','cnt',ts.filter(t=>t.done).length+'/'+ts.length+' '+tr('done')));
    ts.slice(0,5).forEach(t=>b.append(el('div','mt'+(t.done?' d':''),t.text)));
    if(ts.length>5)b.append(el('div','mt','+'+(ts.length-5)+' '+tr('more')));
    b.onclick=()=>{sel=k;tab('today');};
    G.append(b);
  }
}
$('#pw').onclick=()=>{wk=addDays(wk,-7);renderWeek();};
$('#nw').onclick=()=>{wk=addDays(wk,7);renderWeek();};

/* Pomodoro */
const P={mode:'focus',left:25*60,run:false,end:0,h:null};
const dur=m=>(m==='focus'?25:5)*60;
function drawP(){
  $('#ptime').textContent=pad(Math.floor(P.left/60))+':'+pad(P.left%60);
  $('#pmode').textContent=P.mode==='focus'?tr('focus'):tr('brk');
  $('#pgo').textContent=P.run?tr('pause'):tr('start');
  $('.pomo p.m').innerHTML=tr('pnote1')+'<b>'+(S.pomos[todayStr()]||0)+'</b>'+tr('pnote2');
  document.title=P.run?$('#ptime').textContent+' – Plan Your Life':'Plan Your Life';
}
function fillPTask(){
  const s=$('#ptask'),cur=s.value;s.innerHTML='';
  const o=el('option','',tr('noTask'));o.value='';s.append(o);
  S.tasks.filter(t=>t.date===todayStr()&&!t.done).forEach(t=>{const x=el('option','',t.text);x.value=t.id;s.append(x);});
  s.value=cur;
}
function tick(){
  P.left=Math.max(0,Math.round((P.end-Date.now())/1000));
  if(P.left<=0){
    clearInterval(P.h);P.run=false;
    if(P.mode==='focus'){S.pomos[todayStr()]=(S.pomos[todayStr()]||0)+1;earn(5);save();toast(tr('pomoDone'));P.mode='break';}
    else{toast(tr('breakDone'));P.mode='focus';}
    P.left=dur(P.mode);renderHead();
  }
  drawP();
}
$('#pgo').onclick=()=>{
  if(P.run){clearInterval(P.h);P.run=false;}
  else{P.run=true;P.end=Date.now()+P.left*1000;P.h=setInterval(tick,500);}
  drawP();
};
$('#prs').onclick=()=>{clearInterval(P.h);P.run=false;P.left=dur(P.mode);drawP();};
$('#psk').onclick=()=>{clearInterval(P.h);P.run=false;P.mode=P.mode==='focus'?'break':'focus';P.left=dur(P.mode);drawP();};

/* Shop */
const BADGES=[{id:'bronze',days:3,ic:'🥉'},{id:'silver',days:7,ic:'🥈'},{id:'gold',days:21,ic:'🥇'}];
const hab=id=>S.habits.find(h=>h.id===id);
const hsel=new Set();
const addM=(d,n)=>addDays(new Date(d.getFullYear(),d.getMonth()+n,d.getDate()),-1);
function dueOn(h,k){
  if(k<h.created||(h.end&&k>h.end))return false;
  const f=h.freq||'daily';if(f==='daily')return true;
  const d=parse(k);
  if(f==='monthly'){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(h.dom||1,last);}
  if(!(h.days||[]).includes(d.getDay()))return false;
  if(f==='weekly')return true;
  return Math.round((mon(d)-mon(parse(h.created)))/604800000)%2===0;
}
function streakOf(h){
  let d=new Date(),n=0;const t=todayStr();
  if(dueOn(h,t)&&!h.log[t])d=addDays(d,-1);
  for(let i=0;i<800;i++){const k=ymd(d);if(k<h.created)break;if(dueOn(h,k)){if(h.log[k])n++;else break;}d=addDays(d,-1);}
  return n;
}
function freqText(h){
  const f=h.freq||'daily',D=DOWS[S.set.lang],L=(h.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>D[i]).join(', ');
  let t=f==='daily'?tr('fDaily'):f==='weekly'?L:f==='biweekly'?tr('fBi')+': '+L:tr('fMonthly')+' ('+tr('mDay')+' '+h.dom+')';
  if(h.end){const e=parse(h.end);t+=' – '+tr('until')+' '+pad(e.getDate())+'/'+pad(e.getMonth()+1);}
  return t;
}
const FK={daily:'fDaily',weekly:'fWeekly',biweekly:'fBi',monthly:'fMonthly'},DK={none:'dNone','1w':'d1w','2w':'d2w','1m':'d1m','3m':'d3m','6m':'d6m','1y':'d1y',date:'dDate'};
function fillSel(sel,map){const c=sel.value;sel.innerHTML='';Object.keys(map).forEach(k=>{const o=el('option','',tr(map[k]));o.value=k;sel.append(o);});if(c)sel.value=c;}
function drawHForm(){
  fillSel($('#hf'),FK);fillSel($('#hdur'),DK);
  const w=$('#hdw');w.innerHTML='';
  [1,2,3,4,5,6,0].forEach(i=>{const b=el('button','wd'+(hsel.has(i)?' on':''),DOWS[S.set.lang][i]);b.onclick=()=>{if(hsel.has(i))hsel.delete(i);else hsel.add(i);b.classList.toggle('on');};w.append(b);});
  const f=$('#hf').value;
  w.style.display=(f==='weekly'||f==='biweekly')?'flex':'none';
  $('#hdm').style.display=f==='monthly'?'':'none';
  $('#hend').style.display=$('#hdur').value==='date'?'':'none';
}
$('#hf').onchange=drawHForm;$('#hdur').onchange=drawHForm;
function pgBar(c,m,txt){const w=el('div','pg'),f=el('b');f.style.width=Math.min(100,Math.max(0,c)/m*100)+'%';w.append(f,el('span','',txt));return w;}
function fillHSel(){const s=$('#sh'),c=s.value;s.innerHTML='';const o=el('option','',tr('noHabit'));o.value='';s.append(o);S.habits.forEach(h=>{const x=el('option','',h.name);x.value=h.id;s.append(x);});s.value=c;}
function tickHabit(id){const h=hab(id),k=todayStr();if(h.log[k])delete h.log[k];else h.log[k]=1;
  const best=Math.max(0,...S.habits.map(streakOf));
  BADGES.forEach(b=>{if(best>=b.days&&!S.badges[b.id]){S.badges[b.id]=k;toast(tr('badgeGot',tr(b.id)));}});
  save();render();}
function addHabit(){
  const v=$('#hn').value.trim();if(!v)return;
  const f=$('#hf').value,days=[...hsel],t=new Date(),du=$('#hdur').value;
  if((f==='weekly'||f==='biweekly')&&!days.length){toast(tr('needDays'));return;}
  let end='';
  const M={'1w':()=>addDays(t,6),'2w':()=>addDays(t,13),'1m':()=>addM(t,1),'3m':()=>addM(t,3),'6m':()=>addM(t,6),'1y':()=>addM(t,12)};
  if(du==='date'){end=$('#hend').value;if(!end||end<todayStr()){toast(tr('needEnd'));return;}}
  else if(M[du])end=ymd(M[du]());
  const dom=Math.min(31,Math.max(1,Math.floor(+$('#hdm').value||t.getDate())));
  S.habits.push({id:uid(),name:v,created:todayStr(),log:{},freq:f,days:(f==='weekly'||f==='biweekly')?days:[],dom,end});
  $('#hn').value='';hsel.clear();save();render();
}
$('#addh').onclick=addHabit;$('#hn').onkeydown=e=>{if(e.key==='Enter')addHabit();};
function renderHabits(){
  const L=$('#hl');L.innerHTML='';
  if(!S.habits.length)L.append(el('div','empty',tr('emptyH2')));
  S.habits.forEach(h=>{
    const n=streakOf(h),dn=!!h.log[todayStr()],r=el('div','task'+(dn?' done':''));
    const c=el('button','ck',dn?'✓':'');c.onclick=()=>tickHabit(h.id);c.disabled=!dueOn(h,todayStr());
    const f=el('div','flame'+(n?'':' off'));f.append(el('span','','🔥'),el('b','',n));
    const m=el('div','tx');m.append(el('div','',h.name),el('small','sub',freqText(h)));
    const dt=el('div','dots');for(let i=6;i>=0;i--){const k=ymd(addDays(new Date(),-i));dt.append(el('i',h.log[k]?'on':dueOn(h,k)?'':'na'));}m.append(dt);
    const x=el('button','x','×');x.setAttribute('aria-label','Delete');x.onclick=()=>{S.habits=S.habits.filter(k=>k.id!==h.id);save();render();};
    r.append(c,f,m,x);L.append(r);
  });
  const B=$('#bd');B.innerHTML='';
  BADGES.forEach(b=>{const got=!!S.badges[b.id],on=!!S.worn[b.id],d=el('div','bdg'+(got?'':' lock'));
    d.append(el('div','ic',b.ic),el('b','',tr(b.id)),el('small','',b.days+' '+tr('days')));
    if(got){const w=el('button','btn'+(on?' pri':''),on?tr('worn'):tr('wear'));w.onclick=()=>{S.worn[b.id]=!S.worn[b.id];save();render();};d.append(w);}
    B.append(d);});
}
function renderGoal(){
  const g=$('#goal'),it=S.shop.find(k=>k.id===S.pin);g.innerHTML='';g.style.display=it?'':'none';if(!it)return;
  const h=it.habit?hab(it.habit):null,co=Math.max(0,S.coins);
  g.append(el('b','','🎯 '+it.name));
  if(it.price>0)g.append(pgBar(co,it.price,co+'/'+it.price));
  if(it.habit)g.append(pgBar(h?streakOf(h):0,it.days,'🔥 '+(h?streakOf(h):0)+'/'+it.days));
}
function renderShop(){
  const G=$('#items');G.innerHTML='';
  const dir=S.sort==='desc'?-1:1,co=Math.max(0,S.coins);
  $('#sortb').textContent=tr(S.sort==='desc'?'sortD':'sortA');
  [...S.shop].sort((a,b)=>dir*((a.price-b.price)||((a.days||0)-(b.days||0)))).forEach(it=>{
    const h=it.habit?hab(it.habit):null,sk=h?streakOf(h):0;
    const ok=S.coins>=it.price&&(!it.habit||(h&&sk>=it.days));
    const c=el('div','item'),top=el('div','row'),act=el('div','row');top.style.justifyContent='space-between';
    const pin=el('button','x',S.pin===it.id?'★':'☆');pin.setAttribute('aria-label','Pin');pin.onclick=()=>{S.pin=S.pin===it.id?0:it.id;save();render();};
    const x=el('button','x','×');x.setAttribute('aria-label','Delete');x.onclick=()=>{S.shop=S.shop.filter(k=>k.id!==it.id);if(S.pin===it.id)S.pin=0;save();render();};
    act.append(pin,x);top.append(el('b','',it.name),act);c.append(top);
    if(it.price>0)c.append(pgBar(co,it.price,co+'/'+it.price+' '+tr('unit')));
    if(it.habit)c.append(pgBar(sk,it.days,'🔥 '+(h?h.name+' ':'')+sk+'/'+it.days+' '+tr('days')));
    const buy=el('button','btn pri',it.price>0?tr('buy',it.price):tr('redeem'));buy.disabled=!ok;
    buy.onclick=()=>{if(!ok)return;if(it.price)earn(-it.price);S.bought.unshift({name:it.name,price:it.price,at:new Date().toISOString()});save();toast(tr('bought')+it.name);render();};
    c.append(buy);G.append(c);
  });
  if(!S.shop.length)G.append(el('div','empty',tr('emptyS')));
  const H=$('#hist');H.innerHTML='';
  if(!S.bought.length)H.append(el('div','hist',tr('emptyH')));
  S.bought.slice(0,20).forEach(b=>{const d=new Date(b.at);H.append(el('div','hist',pad(d.getDate())+'/'+pad(d.getMonth()+1)+' – '+b.name+(b.price?' (−'+b.price+' '+tr('unit')+')':'')));});
}
$('#sortb').onclick=()=>{S.sort=S.sort==='desc'?'asc':'desc';save();render();};
function addShop(){
  const n=$('#sn').value.trim(),p=Math.max(0,Math.floor(+$('#sp').value||0)),h=+$('#sh').value||0,dd=Math.floor(+$('#sd').value||0),hb=h&&dd>0;
  if(!n||(!(p>0)&&!hb)){toast(tr('needSh'));return;}
  S.shop.push({id:uid(),name:n,price:p,habit:hb?h:0,days:hb?dd:0});$('#sn').value='';$('#sp').value='';$('#sd').value='';save();render();
}
$('#adds').onclick=addShop;

function applySet(){
  const st=S.set,r=document.documentElement;
  r.lang=st.lang;
  const th=THEMES.find(t=>t.id===st.theme)||THEMES[4],V={bg:'--bg',card:'--card',tx:'--tx',mut:'--mut',bd:'--bd',ac:'--teal',on:'--on'};

  r.style.colorScheme=th.dark?'dark':'light';
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=th.v.bg;
  for(const q in MAP)$(q).textContent=tr(MAP[q]);
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  $('#nt').placeholder=tr('phNt');$('#hn').placeholder=tr('phHb');$('#sd').placeholder=tr('days');$('#hdm').placeholder=tr('phDom');$('#sn').placeholder=tr('phSn');$('#sp').placeholder=tr('phSp');
