<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e9f1fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan Your Life">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Plan Your Life</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CHỈNH CỠ CHỮ Ở ĐÂY
   Toàn app chỉ dùng 3 cỡ chữ chính. Sửa số trước chữ "px" là
   mọi chỗ cùng loại đổi theo. Đừng xóa dấu ":" và dấu ";".
   ============================================================ */
:root{
  --cs-tieu-de:20px;      /* TIÊU ĐỀ: tên app, số xu, dòng ngày/tuần, tiêu đề các bảng, chữ "Đã đổi" */
  --cs-noi-dung:15px;     /* NỘI DUNG: tên việc, tên thói quen, tên quà, chữ trên nút, ô nhập (ô nhập tối thiểu 16px để iPhone không tự zoom) */
  --cs-phu:12px;          /* CHỮ PHỤ: tab, nhãn nhỏ, mô tả, ghi chú, nhãn thưởng +10, tên thứ, chữ trên thanh tiến độ */

  /* Cỡ đặc biệt (biểu tượng, đồng hồ) */
  --cs-icon:20px;         /* Biểu tượng: nút ⚙︎ 🏅, dấu ×, ngọn lửa 🔥, tay kéo ⠿ */
  --cs-huy-hieu:36px;     /* Biểu tượng huy hiệu */
  --cs-dong-ho:72px;      /* Đồng hồ Pomodoro */
  --cs-dau-moc:9px;       /* Chữ trong dấu mộc "HOÀN HẢO" */
  --cs-dau-moc-rong:48px; /* Độ rộng dấu mộc (tăng lên nếu chữ mộc to hơn) */
}
/* ============================ HẾT PHẦN CHỈNH CỠ CHỮ ============================ */

:root{--bg:#f2f5fa;--card:#fff;--tx:#14213d;--mut:#6b7488;--bd:#e1e6ef;--gold:#f5b301;--goldtx:#14213d;--teal:#346fb8;--on:#fff;--tealbg:#e1f4f2;--red:#d6455d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 110px}
header{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:var(--cs-tieu-de);margin:0;font-weight:800}
.purse{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--goldtx);padding:8px 16px 8px 8px;border-radius:999px;font-weight:800;font-size:var(--cs-tieu-de)}
.purse i{width:28px;height:28px;border-radius:50%;background:var(--goldtx);color:var(--gold);display:grid;place-items:center;font-style:normal;font-size:var(--cs-phu)}
.purse.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:16px}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;font-size:var(--cs-phu);padding:9px 4px;border-radius:9px;cursor:pointer}
nav button.on{background:var(--tx);color:var(--bg);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
section{display:none}section.on{display:block}
.row{display:flex;align-items:center;gap:8px}
.bar{justify-content:space-between;margin-bottom:12px}
.bar h2{margin:0;font-size:var(--cs-tieu-de)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:var(--cs-noi-dung);padding:8px 12px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--on);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:max(16px,var(--cs-noi-dung));color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
input.grow{flex:1;min-width:0}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:4px 0 14px}
.prog b{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.task .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:none;cursor:pointer;flex:none;color:var(--on);font-size:var(--cs-phu);line-height:1}
.task.done .ck{background:var(--teal);border-color:var(--teal)}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done{opacity:.5}
.rw{font-weight:700;font-size:var(--cs-phu);color:var(--goldtx);background:var(--gold);border-radius:999px;padding:2px 9px;flex:none}

.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:var(--cs-icon);padding:4px 6px}
.empty{color:var(--mut);text-align:center;padding:28px 8px;border:1px dashed var(--bd);border-radius:12px}
.add{margin-bottom:14px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;cursor:pointer;min-height:130px;min-width:0;text-align:left;font:inherit;color:inherit}
.day.today{border:2px solid var(--teal)}
.day h3{margin:0;font-size:var(--cs-phu)}
.day small{color:var(--mut);display:block;margin-bottom:6px}
.day .mt{font-size:var(--cs-phu);padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .mt.d{opacity:.5}
.day .cnt{font-weight:700;font-size:var(--cs-phu);color:var(--teal);margin-bottom:4px}
@media(max-width:640px){.week{grid-template-columns:1fr}.day{min-height:0}}
.pomo{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 16px}
.pomo .t{font-size:var(--cs-dong-ho);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pomo .m{color:var(--mut);margin-bottom:8px}
.pomo .row{justify-content:center;margin-top:16px;flex-wrap:wrap}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item b{overflow-wrap:anywhere}
.item .pr{font-weight:800}
.hist{color:var(--mut);font-size:var(--cs-noi-dung);padding:4px 0;border-bottom:1px solid var(--bd)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.gear{border:1px solid var(--bd);background:var(--card);color:var(--tx);width:40px;height:40px;border-radius:50%;font-size:var(--cs-icon);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.pn{background:var(--card);color:var(--tx);border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
.pn h2{margin:0;font-size:var(--cs-tieu-de)}
.pn h3{font-size:var(--cs-phu);color:var(--mut);margin:18px 0 8px;font-weight:500}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:var(--cs-noi-dung);padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--tx);color:var(--bg);font-weight:700}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw>button:not(.btn){width:32px;height:32px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw>button.on{border-color:var(--tx)}
.sw input{width:40px;height:32px;padding:0;border:0;background:none}
nav button{padding-left:2px;padding-right:2px}
.day{position:relative}
.stamp{position:absolute;right:6px;top:6px;width:var(--cs-dau-moc-rong);height:var(--cs-dau-moc-rong);border:2px solid var(--red);color:var(--red);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:var(--cs-dau-moc);font-weight:800;line-height:1.1;transform:rotate(-14deg);opacity:.85;pointer-events:none}
.pg{position:relative;height:20px;background:var(--bd);border-radius:999px;overflow:hidden;min-width:80px}
.pg b{position:absolute;left:0;top:0;bottom:0;background:var(--teal);opacity:.5}
.pg span{position:relative;display:block;text-align:center;font-size:var(--cs-phu);font-weight:700;line-height:20px;white-space:nowrap;padding:0 6px}
#goal{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin-bottom:14px}
#goal .pg{flex:1}
.item .pg{width:100%}
.fl{font-weight:800;color:#ff7a00;font-size:var(--cs-phu);flex:none}
.flame{display:flex;flex-direction:column;align-items:center;min-width:42px;font-size:var(--cs-icon);line-height:1.1}
.flame b{font-size:var(--cs-noi-dung);font-weight:800;color:#ff7a00}
.flame.off{filter:grayscale(1);opacity:.5}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.dots i.on{background:#ff7a00}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{flex:1;min-width:90px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 6px}
.bdg .ic{font-size:var(--cs-huy-hieu)}
.bdg small{display:block;color:var(--mut)}
.bdg.lock{opacity:.4;filter:grayscale(1)}
.bdg .btn{margin-top:8px;font-size:var(--cs-phu);padding:6px 8px}
::placeholder{color:var(--mut);opacity:1}
.sub{display:block;color:var(--mut);font-size:var(--cs-phu)}
.wd{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:var(--cs-phu);border-radius:8px;padding:6px 8px;cursor:pointer}
.wd.on{background:var(--teal);border-color:var(--teal);color:var(--on)}
#hdw{gap:4px;flex-wrap:wrap}
.dots i.na{background:none;border:1px dashed var(--bd)}
.ck:disabled{opacity:.3;cursor:default}
html,body{touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.sw>button.th{width:auto;height:auto;border-radius:10px;padding:8px 12px;font:inherit;font-size:var(--cs-phu);font-weight:700}
.fm{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.fm input,.fm select{width:100%}
textarea{width:100%;resize:vertical}
.sec{font-size:var(--cs-phu);font-weight:700;color:var(--mut);margin:18px 0 8px}
.grip{cursor:grab;color:var(--mut);touch-action:none;user-select:none;-webkit-user-select:none;padding:4px 2px;font-size:var(--cs-icon);line-height:1;flex:none}
.task.dragging{opacity:.35}
.task.over{outline:2px dashed var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card))}
.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-130%);background:var(--tx);color:var(--bg);padding:6px 12px;border-radius:999px;font-size:var(--cs-phu);font-weight:700;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.child{margin-left:26px;padding:8px 10px;position:relative}
.task.child::before{content:'';position:absolute;left:-14px;top:50%;width:10px;height:2px;background:var(--bd)}
.cbtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:60px;height:60px;border-radius:50%;border:0;background:var(--teal);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:9}
.cbtn.alert{animation:bump 1.4s infinite}
@keyframes bump{50%{transform:translateX(-50%) scale(1.1)}}
.ov.full{padding:0;align-items:stretch}
.ov.full .pn{max-width:none;max-height:none;height:100%;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--bg);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.bubble{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 16px;min-height:44px;text-align:center;max-width:90%}
.cstats{display:flex;flex-direction:column;gap:6px;width:min(90%,360px)}
.csec{width:min(90%,420px)}
.csec h3{margin:6px 0}
.csec .row{flex-wrap:wrap}
#cg{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
#cg.squish{animation:squish .5s}
#cg.hop{animation:hop .5s}
#chead{transform-box:fill-box;transform-origin:50% 90%}
#chead.shake{animation:shake .5s}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes squish{30%{transform:scale(1.1,.88)}60%{transform:scale(.95,1.06)}}
@keyframes hop{40%{transform:translateY(-24px)}}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

.stage{position:relative;width:min(92vw,420px);height:min(44vh,330px);flex:none;border-radius:18px;background:linear-gradient(var(--card),var(--bg));border:1px solid var(--bd);overflow:hidden}
.stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16%;background:color-mix(in srgb,var(--bd) 70%,transparent);pointer-events:none}
.cw{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%;aspect-ratio:240/300;z-index:2;pointer-events:none}
.cw svg{width:100%;height:100%;display:block}
#cbody,#chead{pointer-events:auto}
#cpad{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:auto;cursor:crosshair;touch-action:none}
.drawing #cpad{display:block}
#props{position:absolute;inset:0;z-index:1}
.prop{position:absolute;transform:translate(-50%,-50%);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;-webkit-user-drag:none;height:auto}
.prop.sel{outline:2px dashed var(--teal);outline-offset:2px}
.tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tl .c{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer}
.tl .c.on{border-color:var(--tx)}
.ipad{width:min(80vw,300px);aspect-ratio:1;background:var(--card);border:1px dashed var(--bd);border-radius:12px;touch-action:none}
.cm{display:contents}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-size:var(--cs-noi-dung)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Plan Your Life</h1><div class="row"><button class="gear" id="bgb" aria-label="Badges">🏅</button><button class="gear" id="gear" aria-label="Settings">⚙︎</button><div class="purse" id="purse"><i>$</i><span id="coins">0</span></div></div></header>
  <nav id="nav">
    <button data-t="today" class="on">Hôm nay</button>
    <button data-t="week">Tuần</button>
    <button data-t="habits">Thói quen</button>
    <button data-t="pomo">Pomodoro</button>
    <button data-t="shop">Cửa hàng</button>
  </nav>
  <div id="goal"></div>

  <section id="today" class="on">
    <div class="row bar">
      <button class="btn" id="pd">‹</button>
      <h2 id="dlabel"></h2>
      <div class="row"><button class="btn" id="td">Hôm nay</button><button class="btn" id="nd">›</button></div>
    </div>
    <div class="prog"><b id="pb"></b></div>
    <div class="row bar"><button class="btn pri" id="opent"></button></div>
    <div id="list"></div>
  </section>

  <section id="week">
    <div class="row bar">
      <button class="btn" id="pw">‹</button><h2 id="wlabel"></h2><button class="btn" id="nw">›</button>
    </div>
    <div class="week" id="wgrid"></div>
  </section>

  <section id="pomo">
    <div class="pomo">
      <div class="m" id="pmode">Tập trung</div>
      <div class="t" id="ptime">25:00</div>
      <div class="row"><select id="ptask"></select></div>
      <div class="row">
        <button class="btn pri" id="pgo">Bắt đầu</button>
        <button class="btn" id="prs">Đặt lại</button>
        <button class="btn" id="psk">Bỏ qua</button>
      </div>
      <p class="m" style="margin-top:16px">Mỗi phiên tập trung 25 phút xong nhận +5 xu. Hôm nay: <b id="pcount">0</b> phiên.</p>
    </div>
  </section>

  <section id="shop">
        <div class="row bar"><button class="btn" id="sortb"></button><button class="btn pri" id="opens"></button></div>
    <div class="shop" id="items"></div>
    <h2 style="font-size:var(--cs-tieu-de)">Đã đổi</h2>
    <div id="hist"></div>
  </section>

  <section id="habits">
    <div class="row bar"><button class="btn pri" id="openh"></button></div>
    <div id="hl"></div>
  </section>
</div>
<div class="ov" id="ov"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="settings"></h2><button class="x" id="cls" aria-label="Close">×</button></div>
  <h3 data-i="lang"></h3><div class="seg" id="sl"><button data-v="vi">Tiếng Việt</button><button data-v="en">English</button></div>
  <h3 data-i="theme"></h3><div class="sw" id="sw"></div>
</div></div>
<div class="ov" id="ovb"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="badgesT"></h2><button class="x" id="clsb" aria-label="Close">×</button></div>
  <div class="badges" id="bd" style="margin-top:14px"></div>
</div></div>
<div class="ov" id="ovs"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="addReward"></h2><button class="x" id="clss" aria-label="Close">×</button></div>
  <div class="fm">
    <input id="sn" maxlength="60">
    <input id="sp" type="number" min="1">
    <select id="sh"></select>
    <input id="sd" type="number" min="1">
    <span class="sub" data-i="hintS"></span>
    <button class="btn pri" id="adds"></button>
  </div>
</div></div>
<div class="ov" id="ovt"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="addTask"></h2><button class="x" id="clst" aria-label="Close">×</button></div>
  <div class="fm">
    <input id="nt" maxlength="120">
    <select id="nr"><option value="5">+5</option><option value="10" selected>+10</option><option value="20">+20</option><option value="50">+50</option></select>
    <input type="date" id="ntd">
    <button class="btn pri" id="addt"></button>
  </div>
</div></div>
<div class="ov" id="ovh"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between"><h2 data-i="addHabit"></h2><button class="x" id="clsh" aria-label="Close">×</button></div>
  <div class="fm">
    <input id="hn" maxlength="60">
    <select id="hf"></select>
    <div class="row" id="hdw"></div>
    <input id="hdm" type="number" min="1" max="31">
    <select id="hdur"></select>
    <input id="hend" type="date">
    <button class="btn pri" id="addh"></button>
  </div>
</div></div>
<div class="ov" id="ovd"><div class="pn" role="dialog" aria-modal="true">
  <div class="row" style="justify-content:space-between;gap:8px"><input id="dt" class="grow" maxlength="120" style="font-weight:700"><button class="x" id="clsd" aria-label="Close">×</button></div>
  <h3 data-i="lblDate"></h3><input type="date" id="dd" style="width:100%">
  <h3 data-i="lblNote"></h3><textarea id="dn" rows="4"></textarea>
  <h3 data-i="lblSub"></h3><div id="dsl"></div>
  <div class="row add" style="margin-top:8px"><input class="grow" id="dsn" maxlength="100"><button class="btn" id="dsa"></button></div>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const KEY='planner-xu-v1';
let S={coins:0,tasks:[],shop:[{id:1,name:'Trà sữa',price:50},{id:2,name:'1 tập phim',price:30},{id:3,name:'30 phút chơi game',price:40}],bought:[],pomos:{},set:{lang:'vi',theme:'blue'},habits:[],badges:{},worn:{},pin:0,sort:'asc',char:{name:'',fed:80,fedAt:Date.now(),hat:'',owned:[],days:{},paint:''},scene:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast(tr('storageFull'));}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const mon=d=>addDays(d,-((d.getDay()+6)%7));
const DOWS={vi:['CN','T2','T3','T4','T5','T6','T7'],en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
let sel=ymd(new Date()), wk=mon(new Date());
const todayStr=()=>ymd(new Date());
const uid=()=>Date.now()+Math.floor(Math.random()*1000);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800);}
function earn(n){S.coins+=n;const p=$('#purse');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');}
function tab(t){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();}
$('#nav').onclick=e=>{if(e.target.dataset.t)tab(e.target.dataset.t);};

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

let curId=0,drag=null;
function sec(L,txt,n){L.append(el('div','sec',txt+' · '+n));}
function taskRow(t,child){
  const kids=child?[]:S.tasks.filter(k=>k.parent===t.id),kd=kids.filter(k=>k.done).length;
  const r=el('div','task'+(child?' child':'')+(t.done?' done':''));
  const c=el('button','ck',t.done?'✓':'');c.setAttribute('aria-label','Done');c.onclick=()=>toggle(t.id);
  const tx=el('div','tx');tx.style.cursor='pointer';tx.append(el('div','',t.text));
  const meta=[];if(kids.length)meta.push('☰ '+kd+'/'+kids.length);if(t.note)meta.push('📝');
  if(meta.length)tx.append(el('small','sub',meta.join('   ')));
  tx.onclick=()=>openD(child?t.parent:t.id);
  r.append(c,tx,el('span','rw','+'+t.reward));
  if(!t.done||child)r.dataset.tid=t.id;
  if(!t.done){const g=el('span','grip','⠿');g.onpointerdown=e=>startDrag(e,t,r);r.append(g);}
  const x=el('button','x','×');x.setAttribute('aria-label','Delete');x.onclick=()=>delTask(t.id);
  r.append(x);return r;
}
function grp(L,t){L.append(taskRow(t));S.tasks.filter(k=>k.parent===t.id).forEach(k=>L.append(taskRow(k,true)));}
function renderToday(){
  const d=parse(sel);
  $('#dlabel').textContent=(sel===todayStr()?tr('todayC'):DOWS[S.set.lang][d.getDay()]+', ')+pad(d.getDate())+'/'+pad(d.getMonth()+1);
  const all=S.tasks.filter(t=>t.date===sel&&!t.parent),todo=all.filter(t=>!t.done),dn=all.filter(t=>t.done);
  $('#pb').style.width=(all.length?dn.length/all.length*100:0)+'%';
  const L=$('#list');L.innerHTML='';
  const hs=sel===todayStr()?S.habits.filter(h=>dueOn(h,sel)):[];
  if(!all.length&&!hs.length){L.append(el('div','empty',tr('emptyT')));return;}
  if(todo.length){sec(L,tr('secTodo'),todo.length);todo.forEach(t=>grp(L,t));}
  if(hs.length){sec(L,tr('habits'),hs.length);
    hs.forEach(h=>{const ok=!!h.log[sel],r=el('div','task'+(ok?' done':'')),c=el('button','ck',ok?'✓':'');c.onclick=()=>tickHabit(h.id);r.append(c,el('div','tx',h.name),el('span','fl','🔥 '+streakOf(h)));L.append(r);});}
  if(dn.length){sec(L,tr('secDone'),dn.length);dn.forEach(t=>grp(L,t));}
}
function toggle(id){
  const t=S.tasks.find(k=>k.id===id);if(!t)return;
  t.done=!t.done;
  if(t.done){earn(t.reward);toast(tr('earned',t.reward));}else earn(-t.reward);
  save();render();
}
function delTask(id){
  const ids=new Set([id]);S.tasks.forEach(k=>{if(k.parent===id)ids.add(k.id);});
  S.tasks.filter(k=>ids.has(k.id)&&k.done).forEach(k=>earn(-k.reward));
  S.tasks=S.tasks.filter(k=>!ids.has(k.id));save();render();
}
function addTask(){
  const v=$('#nt').value.trim();if(!v)return;
  S.tasks.push({id:uid(),text:v,date:$('#ntd').value||sel,reward:+$('#nr').value,done:false});
  $('#nt').value='';$('#ovt').classList.remove('on');save();render();
}
/* kéo thả: thả một việc lên việc khác để thành việc nhỏ */
function rowAt(e){const x=document.elementFromPoint(e.clientX,e.clientY);return x?x.closest('[data-tid]'):null;}
function startDrag(e,t,row){
  e.preventDefault();
  const g=el('div','ghost',t.text);document.body.append(g);
  drag={t,row,g};row.classList.add('dragging');moveDrag(e);
  window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag);window.addEventListener('pointercancel',stopDrag);
}
function moveDrag(e){
  if(!drag)return;
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  document.querySelectorAll('.task.over').forEach(x=>x.classList.remove('over'));
  const r=rowAt(e);if(r&&+r.dataset.tid!==drag.t.id)r.classList.add('over');
}
function stopDrag(){
  if(!drag)return null;
  drag.g.remove();drag.row.classList.remove('dragging');
  document.querySelectorAll('.task.over').forEach(x=>x.classList.remove('over'));
  window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointerup',endDrag);window.removeEventListener('pointercancel',stopDrag);
  const d=drag;drag=null;return d;
}
function endDrag(e){
  const r=rowAt(e),d=stopDrag();if(!d)return;
  const t=d.t;
  if(!r){if(t.parent){t.parent=0;save();render();toast(tr('detached'));}return;}
  const hit=S.tasks.find(k=>k.id===+r.dataset.tid);if(!hit||hit.id===t.id)return;
  const pid=hit.parent||hit.id;
  if(pid===t.parent||pid===t.id)return;
  if(S.tasks.some(k=>k.parent===t.id)){toast(tr('noNest'));return;}
  const p=S.tasks.find(k=>k.id===pid);
  t.parent=pid;t.date=p.date;save();render();toast(tr('nested'));
}
/* khung chi tiết việc */
const cur=()=>S.tasks.find(k=>k.id===curId);
function openD(id){curId=id;drawDetail();$('#ovd').classList.add('on');}
function closeD(){$('#ovd').classList.remove('on');curId=0;render();}
function drawDetail(){
  const t=cur();if(!t){closeD();return;}
  if($('#dt').value!==t.text)$('#dt').value=t.text;
  if($('#dd').value!==t.date)$('#dd').value=t.date;
  if($('#dn').value!==(t.note||''))$('#dn').value=t.note||'';
  const L=$('#dsl');L.innerHTML='';
  S.tasks.filter(k=>k.parent===t.id).forEach(k=>{
    const r=el('div','task'+(k.done?' done':'')),c=el('button','ck',k.done?'✓':'');c.onclick=()=>toggle(k.id);
    const u=el('button','x','↑');u.title=tr('detach');u.onclick=()=>{k.parent=0;save();render();};
    const x=el('button','x','×');x.onclick=()=>delTask(k.id);
    r.append(c,el('div','tx',k.text),u,x);L.append(r);
  });
}
function addSub(){
  const v=$('#dsn').value.trim(),t=cur();if(!v||!t)return;
  S.tasks.push({id:uid(),text:v,date:t.date,reward:5,done:false,parent:t.id});$('#dsn').value='';save();render();
}
$('#addt').onclick=addTask;
$('#nt').onkeydown=e=>{if(e.key==='Enter')addTask();};
$('#pd').onclick=()=>{sel=ymd(addDays(parse(sel),-1));render();};
$('#nd').onclick=()=>{sel=ymd(addDays(parse(sel),1));render();};
$('#td').onclick=()=>{sel=todayStr();render();};

function renderWeek(){
  const e=addDays(wk,6);
  $('#wlabel').textContent=pad(wk.getDate())+'/'+pad(wk.getMonth()+1)+' – '+pad(e.getDate())+'/'+pad(e.getMonth()+1);
  const G=$('#wgrid');G.innerHTML='';
  for(let i=0;i<7;i++){
    const d=addDays(wk,i),k=ymd(d),ts=S.tasks.filter(t=>t.date===k),top=ts.filter(t=>!t.parent);
    const b=el('button','day'+(k===todayStr()?' today':''));
    b.append(el('h3','',DOWS[S.set.lang][d.getDay()]),el('small','',pad(d.getDate())+'/'+pad(d.getMonth()+1)));
    const hd=S.habits.filter(h=>dueOn(h,k));
    if((ts.length||hd.length)&&ts.every(t=>t.done)&&hd.every(h=>h.log[k]))b.append(el('div','stamp',tr('perfect')));
    if(top.length)b.append(el('div','cnt',top.filter(t=>t.done).length+'/'+top.length+' '+tr('done')));
    top.slice(0,5).forEach(t=>b.append(el('div','mt'+(t.done?' d':''),t.text)));
    if(top.length>5)b.append(el('div','mt','+'+(top.length-5)+' '+tr('more')));
    b.onclick=()=>{sel=k;tab('today');};
    G.append(b);
  }
}
$('#pw').onclick=()=>{wk=addDays(wk,-7);renderWeek();};
$('#nw').onclick=()=>{wk=addDays(wk,7);renderWeek();};

/* Pomodoro */
const P={mode:'focus',left:25*60,run:false,end:0,h:null};
const dur=m=>(m==='focus'?25:5)*60;
function drawP(){
  $('#ptime').textContent=pad(Math.floor(P.left/60))+':'+pad(P.left%60);
  $('#pmode').textContent=P.mode==='focus'?tr('focus'):tr('brk');
  $('#pgo').textContent=P.run?tr('pause'):tr('start');
  $('.pomo p.m').innerHTML=tr('pnote1')+'<b>'+(S.pomos[todayStr()]||0)+'</b>'+tr('pnote2');
  document.title=P.run?$('#ptime').textContent+' – Plan Your Life':'Plan Your Life';
}
function fillPTask(){
  const s=$('#ptask'),cur=s.value;s.innerHTML='';
  const o=el('option','',tr('noTask'));o.value='';s.append(o);
  S.tasks.filter(t=>t.date===todayStr()&&!t.done).forEach(t=>{const x=el('option','',t.text);x.value=t.id;s.append(x);});
  s.value=cur;
}
function tick(){
  P.left=Math.max(0,Math.round((P.end-Date.now())/1000));
  if(P.left<=0){
    clearInterval(P.h);P.run=false;
    if(P.mode==='focus'){S.pomos[todayStr()]=(S.pomos[todayStr()]||0)+1;earn(5);save();toast(tr('pomoDone'));P.mode='break';}
    else{toast(tr('breakDone'));P.mode='focus';}
    P.left=dur(P.mode);renderHead();
  }
  drawP();
}
$('#pgo').onclick=()=>{
  if(P.run){clearInterval(P.h);P.run=false;}
  else{P.run=true;P.end=Date.now()+P.left*1000;P.h=setInterval(tick,500);}
  drawP();
};
$('#prs').onclick=()=>{clearInterval(P.h);P.run=false;P.left=dur(P.mode);drawP();};
$('#psk').onclick=()=>{clearInterval(P.h);P.run=false;P.mode=P.mode==='focus'?'break':'focus';P.left=dur(P.mode);drawP();};

/* Shop */
const BADGES=[{id:'bronze',days:3,ic:'🥉'},{id:'silver',days:7,ic:'🥈'},{id:'gold',days:21,ic:'🥇'}];
const hab=id=>S.habits.find(h=>h.id===id);
const hsel=new Set();
const addM=(d,n)=>addDays(new Date(d.getFullYear(),d.getMonth()+n,d.getDate()),-1);
function dueOn(h,k){
  if(k<h.created||(h.end&&k>h.end))return false;
  const f=h.freq||'daily';if(f==='daily')return true;
  const d=parse(k);
  if(f==='monthly'){const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()===Math.min(h.dom||1,last);}
  if(!(h.days||[]).includes(d.getDay()))return false;
  if(f==='weekly')return true;
  return Math.round((mon(d)-mon(parse(h.created)))/604800000)%2===0;
}
function streakOf(h){
  let d=new Date(),n=0;const t=todayStr();
  if(dueOn(h,t)&&!h.log[t])d=addDays(d,-1);
  for(let i=0;i<800;i++){const k=ymd(d);if(k<h.created)break;if(dueOn(h,k)){if(h.log[k])n++;else break;}d=addDays(d,-1);}
  return n;
}
function freqText(h){
  const f=h.freq||'daily',D=DOWS[S.set.lang],L=(h.days||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>D[i]).join(', ');
  let t=f==='daily'?tr('fDaily'):f==='weekly'?L:f==='biweekly'?tr('fBi')+': '+L:tr('fMonthly')+' ('+tr('mDay')+' '+h.dom+')';
  if(h.end){const e=parse(h.end);t+=' – '+tr('until')+' '+pad(e.getDate())+'/'+pad(e.getMonth()+1);}
  return t;
}
const FK={daily:'fDaily',weekly:'fWeekly',biweekly:'fBi',monthly:'fMonthly'},DK={none:'dNone','1w':'d1w','2w':'d2w','1m':'d1m','3m':'d3m','6m':'d6m','1y':'d1y',date:'dDate'};
function fillSel(sel,map){const c=sel.value;sel.innerHTML='';Object.keys(map).forEach(k=>{const o=el('option','',tr(map[k]));o.value=k;sel.append(o);});if(c)sel.value=c;}
function drawHForm(){
  fillSel($('#hf'),FK);fillSel($('#hdur'),DK);
  const w=$('#hdw');w.innerHTML='';
  [1,2,3,4,5,6,0].forEach(i=>{const b=el('button','wd'+(hsel.has(i)?' on':''),DOWS[S.set.lang][i]);b.onclick=()=>{if(hsel.has(i))hsel.delete(i);else hsel.add(i);b.classList.toggle('on');};w.append(b);});
  const f=$('#hf').value;
  w.style.display=(f==='weekly'||f==='biweekly')?'flex':'none';
  $('#hdm').style.display=f==='monthly'?'':'none';
  $('#hend').style.display=$('#hdur').value==='date'?'':'none';
}
$('#hf').onchange=drawHForm;$('#hdur').onchange=drawHForm;
function pgBar(c,m,txt){const w=el('div','pg'),f=el('b');f.style.width=Math.min(100,Math.max(0,c)/m*100)+'%';w.append(f,el('span','',txt));return w;}
function fillHSel(){const s=$('#sh'),c=s.value;s.innerHTML='';const o=el('option','',tr('noHabit'));o.value='';s.append(o);S.habits.forEach(h=>{const x=el('option','',h.name);x.value=h.id;s.append(x);});s.value=c;}
function tickHabit(id){const h=hab(id),k=todayStr();if(h.log[k])delete h.log[k];else h.log[k]=1;
  const best=Math.max(0,...S.habits.map(streakOf));
  BADGES.forEach(b=>{if(best>=b.days&&!S.badges[b.id]){S.badges[b.id]=k;toast(tr('badgeGot',tr(b.id)));}});
  save();render();}
function addHabit(){
  const v=$('#hn').value.trim();if(!v)return;
  const f=$('#hf').value,days=[...hsel],t=new Date(),du=$('#hdur').value;
  if((f==='weekly'||f==='biweekly')&&!days.length){toast(tr('needDays'));return;}
  let end='';
  const M={'1w':()=>addDays(t,6),'2w':()=>addDays(t,13),'1m':()=>addM(t,1),'3m':()=>addM(t,3),'6m':()=>addM(t,6),'1y':()=>addM(t,12)};
  if(du==='date'){end=$('#hend').value;if(!end||end<todayStr()){toast(tr('needEnd'));return;}}
  else if(M[du])end=ymd(M[du]());
  const dom=Math.min(31,Math.max(1,Math.floor(+$('#hdm').value||t.getDate())));

  const c=S.char,k=todayStr(),st=charState();if(!c.days)c.days={};
  const v=st.mood>=100&&st.full>=100?2:(st.mood>=80&&st.full>=80?1:0);
  if(v>(c.days[k]||0)){const b=ageOf();c.days[k]=v;save();if(ageOf()>b)toast(tr('grewUp',ageOf()));}
}
function say(kind,extra){const L=LINES[S.set.lang][kind];$('#cb').textContent=L[Math.floor(Math.random()*L.length)]+(extra||'');}
function anim(id,cls){const e=$('#'+id);e.classList.remove(cls);requestAnimationFrame(()=>{e.classList.add(cls);setTimeout(()=>e.classList.remove(cls),600);});}
function talk(){const m=$('#cmouth');m.setAttribute('d','M108 138 Q120 164 132 138Z');m.setAttribute('fill','#6b2d2d');setTimeout(drawChar,700);}
function drawChar(){
  const c=S.char,st=charState(),a=ageOf(),sg=stageOf(a),g=growth(),nx=STAGES.find(x=>x.age>a),face=Math.round((st.mood+st.full)/2);
  $('#ccoins').textContent=S.coins;
  if($('#cn')!==document.activeElement)$('#cn').value=c.name;
  $('#cn').placeholder=tr('nameDef');
  $('#cage').textContent=tr(sg.id)+' · '+a+' '+tr('yrs')+(nx?'   →   '+tr(nx.id)+' ('+nx.age+')':'');
  const m=$('#cmouth');m.setAttribute('fill','none');
  m.setAttribute('d',face>=70?'M104 138 Q120 158 136 138':face>=40?'M108 144 L132 144':'M106 150 Q120 134 134 150');
  $('#cs').setAttribute('transform',drawing?'':'translate(120 280) scale('+sg.sc+') translate(-120 -280)');
  $('#chair').style.display=sg.id==='baby'?'none':'';$('#chair').setAttribute('fill',sg.hair);
  $('#ctuft').style.display=sg.id==='baby'?'':'none';$('#cdiaper').style.display=sg.id==='baby'?'':'none';
  $('#cglass').style.display=sg.id==='senior'?'':'none';
  const pi=$('#cpaint');pi.style.display=c.paint&&!drawing?'':'none';if(c.paint)pi.setAttribute('href',c.paint);
  $('#chatx').textContent=c.hat;
  $('#cbadges').textContent=BADGES.filter(b=>S.worn[b.id]).map(b=>b.ic).join('');
  const T2=$('#cst');T2.innerHTML='';T2.append(pgBar(st.mood,100,'😊 '+st.mood+'%'),pgBar(st.full,100,'🍎 '+st.full+'%'),pgBar(g%10,10,'🎂 '+(g%10)+'/10 '+tr('days')));
  const F=$('#cfood');F.innerHTML='';
  FOODS.forEach(f=>{const b=el('button','btn',f.ic+' '+f.p+' '+tr('unit'));b.disabled=S.coins<f.p;b.onclick=()=>{if(S.coins<f.p){say('poor');return;}earn(-f.p);c.fed=Math.min(100,fullness()+f.g);c.fedAt=Date.now();save();anim('cg','hop');talk();say('fed');render();};F.append(b);});
  const H=$('#chat');H.innerHTML='';
  HATS.forEach(h=>{const own=h.p===0||c.owned.includes(h.id),b=el('button','btn'+(c.hat===h.id?' pri':''),h.ic+(own?'':' '+h.p));
    b.disabled=!own&&S.coins<h.p;
    b.onclick=()=>{if(!own){earn(-h.p);c.owned.push(h.id);}c.hat=h.id;save();anim('cg','hop');say('hat');render();};H.append(b);});
  $('#cprop').style.display=selP&&S.scene.some(p=>p.id===selP)?'':'none';
}
/* bảng vẽ dùng chung */
const COLS=['#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#6d4c41','#111111','#ffffff'];
function makePad(cv,host){
  const ctx=cv.getContext('2d'),st={color:'#e53935',size:5,erase:false};let down=false,lx=0,ly=0;
  const k=()=>cv.width/cv.getBoundingClientRect().width;
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  const style=()=>{ctx.globalCompositeOperation=st.erase?'destination-out':'source-over';ctx.strokeStyle=st.color;ctx.fillStyle=st.color;ctx.lineWidth=st.size*k();ctx.lineCap='round';ctx.lineJoin='round';};
  cv.onpointerdown=e=>{down=true;[lx,ly]=pos(e);cv.setPointerCapture(e.pointerId);style();ctx.beginPath();ctx.arc(lx,ly,st.size*k()/2,0,7);ctx.fill();};
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);style();ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(x,y);ctx.stroke();lx=x;ly=y;};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;};
  const tb=()=>{host.innerHTML='';
    COLS.forEach(c=>{const b=el('button','c'+(!st.erase&&st.color===c?' on':''));b.style.background=c;b.setAttribute('aria-label',c);b.onclick=()=>{st.color=c;st.erase=false;tb();};host.append(b);});
    const ci=document.createElement('input');ci.type='color';ci.value=st.color;ci.style.cssText='width:34px;height:30px;padding:0;border:0;background:none';ci.oninput=()=>{st.color=ci.value;st.erase=false;};host.append(ci);
    [3,6,12].forEach(z=>{const b=el('button','btn'+(st.size===z?' pri':''),'●');b.style.fontSize=(10+z)+'px';b.onclick=()=>{st.size=z;tb();};host.append(b);});
    const er=el('button','btn'+(st.erase?' pri':''),'⌫');er.onclick=()=>{st.erase=!st.erase;tb();};host.append(er);
    const cl=el('button','btn','🗑');cl.onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);host.append(cl);};
  tb();return {ctx};
}
const P1=makePad($('#cpad'),$('#ctl')),P2=makePad($('#ipad'),$('#itl'));
/* Vẽ nhân vật */
function startPaint(){
  drawing=true;$('#ovc').classList.add('drawing');$('#cmain').style.display='none';$('#cdraw').style.display='';
  const cv=$('#cpad'),ctx=P1.ctx;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,cv.width,cv.height);
  if(S.char.paint){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=S.char.paint;}
  drawChar();
}
function endPaint(ok){
  if(ok){S.char.paint=$('#cpad').toDataURL('image/png');save();say('art');}
  drawing=false;$('#ovc').classList.remove('drawing');$('#cmain').style.display='';$('#cdraw').style.display='none';drawChar();
}
$('#bpaint').onclick=startPaint;$('#pok').onclick=()=>endPaint(true);$('#pcan').onclick=()=>endPaint(false);
/* vật dụng và ảnh trong khu vực đứng */
function cropCanvas(cv){
  const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return null;
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(cv,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}
function addProp(src,w){
  if(S.scene.length>=15){toast(tr('sceneFull'));return;}
  const id=uid();S.scene.push({id,src,x:.2+Math.random()*.6,y:.45+Math.random()*.3,w});selP=id;save();renderProps();drawChar();say('art');
}
function renderProps(){
  const H=$('#props');H.innerHTML='';
  S.scene.forEach(p=>{
    const im=document.createElement('img');im.src=p.src;im.draggable=false;im.className='prop'+(p.id===selP?' sel':'');
    im.style.left=p.x*100+'%';im.style.top=p.y*100+'%';im.style.width=p.w+'px';
    im.onpointerdown=e=>{
      e.preventDefault();selP=p.id;const r=$('#stage').getBoundingClientRect();im.setPointerCapture(e.pointerId);
      im.onpointermove=v=>{p.x=Math.max(0,Math.min(1,(v.clientX-r.left)/r.width));p.y=Math.max(0,Math.min(1,(v.clientY-r.top)/r.height));im.style.left=p.x*100+'%';im.style.top=p.y*100+'%';};
      im.onpointerup=()=>{im.onpointermove=im.onpointerup=null;save();renderProps();drawChar();};
    };
    H.append(im);
  });
}
$('#stage').onpointerdown=e=>{if(e.target.id==='stage'||e.target.id==='props'){selP=0;renderProps();drawChar();}};
$('#pp').onclick=()=>{const p=S.scene.find(x=>x.id===selP);if(p){p.w=Math.min(300,Math.round(p.w*1.2));save();renderProps();}};
$('#pm').onclick=()=>{const p=S.scene.find(x=>x.id===selP);if(p){p.w=Math.max(30,Math.round(p.w/1.2));save();renderProps();}};
$('#pdel').onclick=()=>{S.scene=S.scene.filter(x=>x.id!==selP);selP=0;save();renderProps();drawChar();};
$('#bitem').onclick=()=>{P2.ctx.globalCompositeOperation='source-over';P2.ctx.clearRect(0,0,300,300);$('#ovi').classList.add('on');};
$('#iok').onclick=()=>{const o=cropCanvas($('#ipad'));if(!o){toast(tr('emptyDraw'));return;}$('#ovi').classList.remove('on');addProp(o.toDataURL('image/png'),Math.max(40,Math.min(130,o.width*.45)));};
$('#clsi').onclick=()=>$('#ovi').classList.remove('on');
$('#ovi').onclick=e=>{if(e.target.id==='ovi')$('#ovi').classList.remove('on');};
$('#bphoto').onclick=()=>$('#cfile').click();
$('#cfile').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const m=Math.min(1,240/Math.max(im.width,im.height)),o=document.createElement('canvas');o.width=Math.round(im.width*m);o.height=Math.round(im.height*m);o.getContext('2d').drawImage(im,0,0,o.width,o.height);URL.revokeObjectURL(u);addProp(o.toDataURL('image/jpeg',.8),100);};
  im.src=u;
};
/* mở / đóng màn hình nhân vật */
$('#cbtn').onclick=()=>{drawChar();renderProps();const st=charState();say(st.full<25?'hungry':st.mood>=70?'happy':st.mood>=40?'ok':'sad',st.n?' ('+st.d+'/'+st.n+')':'');$('#ovc').classList.add('on');};
$('#clsc').onclick=()=>{if(drawing)endPaint(false);$('#ovc').classList.remove('on');};
$('#cn').oninput=e=>{S.char.name=e.target.value;save();};
$('#chead').onclick=()=>{anim('chead','shake');talk();say('poke');};
$('#cbody').onclick=()=>{anim('cg','squish');talk();say('tickle');};
applySet();render();
</script>
